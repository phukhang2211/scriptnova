# Optional — most people should just use setup.bat / run.bat instead.
# Docker is only useful here if you'd rather not install Python directly.
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/db.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  sqlite_data:
  media_data:
  static_data:
